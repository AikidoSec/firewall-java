name: 🧪 Unit Tests

on:
  push:

permissions:
    contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '21'
          distribution: 'adopt'

      - name: Build with Gradle
        working-directory: ./
        run: |
          chmod +x gradlew
          make wasm
          make build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkg-build
          path: ./
  test-and-coverage:
    needs: build
    runs-on: ubuntu-latest

    continue-on-error: true
    strategy:
      matrix:
        java-version: [17, 18, 19, 20, 21, 24, 25]
        distribution: ['adopt', 'corretto', 'oracle']

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: pkg-build

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: ${{ matrix.distribution }}

      - name: Add local.aikido.io to /etc/hosts
        run: |
          echo "127.0.0.1 local.aikido.io" | sudo tee -a /etc/hosts
          echo "127.0.0.1 app.local.aikido.io" | sudo tee -a /etc/hosts

      - name: Start databases
        working-directory: ./sample-apps/databases
        run: docker compose up --build -d postgres_database mysql_database mssql_database && sleep 10

      - name: Start mock server
        working-directory: ./end2end/server
        run: docker build -t mock_core . && docker run --name mock_core -d -p 5000:5000 mock_core

      - name: Create temporary directory
        run: |
          mkdir -p /opt/aikido
          chmod 777 /opt/aikido

      - name: Run test cases
        working-directory: ./
        run: chmod +x gradlew && make test

      - name: Run coverage with Gradle
        if: matrix.java-version == '21'  # Only run coverage for Java 21
        working-directory: ./
        run: chmod +x gradlew && ./gradlew clean && make cov

      - name: Upload LCOV coverage report
        if: ${{ !cancelled() && matrix.java-version == '21' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-java-${{ matrix.java-version }}-${{ matrix.distribution }}
          path: agent_api/build/jacoco/test/lcov.info
          if-no-files-found: error

      - name: Upload coverage report to Codecov
        if: matrix.java-version == '21'  # Only upload coverage for Java 21
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          fail_ci_if_error: true
          files: ./agent_api/build/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  upload-coverage:
    needs: test-and-coverage
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download LCOV artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: coverage-reports
          pattern: coverage-java-*
          merge-multiple: false

      - name: Upload coverage to Aikido
        uses: AikidoSec/code-coverage-github-action@660c7844f246c44570d9c035f5b51ffe7f266a79 # v1.0.0
        with:
          lcov-file-paths: |
            coverage-reports/coverage-java-21-adopt/lcov.info
            coverage-reports/coverage-java-21-corretto/lcov.info
            coverage-reports/coverage-java-21-oracle/lcov.info
          fail-on-error: false

name: 🧪 Unit Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
    contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        working-directory: ./
        run: |
          chmod +x gradlew
          make wasm
          make build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-build
          path: ./
  test-and-coverage:
    needs: build
    runs-on: ubuntu-latest

    continue-on-error: true
    strategy:
      matrix:
        java-version: [17, 18, 19, 20, 21, 24, 25]
        distribution: ['temurin', 'corretto', 'oracle']

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkg-build

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: ${{ matrix.distribution }}

      - name: Add local.aikido.io to /etc/hosts
        run: |
          echo "127.0.0.1 local.aikido.io" | sudo tee -a /etc/hosts
          echo "127.0.0.1 app.local.aikido.io" | sudo tee -a /etc/hosts

      - name: Start databases
        working-directory: ./sample-apps/databases
        run: docker compose up --build -d postgres_database mysql_database mssql_database && sleep 10

      - name: Start mock server
        working-directory: ./end2end/server
        run: docker build -t mock_core . && docker run --name mock_core -d -p 5000:5000 mock_core

      - name: Create temporary directory
        run: |
          mkdir -p /opt/aikido
          chmod 777 /opt/aikido

      - name: Run test cases
        working-directory: ./
        run: chmod +x gradlew && make test

      - name: Run coverage with Gradle
        if: matrix.java-version == '21'  # Only run coverage for Java 21
        working-directory: ./
        run: chmod +x gradlew && ./gradlew clean && make cov

      - name: Upload coverage report to Codecov
        if: matrix.java-version == '21'  # Only upload coverage for Java 21
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: true
          files: ./agent_api/build/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

name: 🔥 Smoke Tests for FFI

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    smoke-test-native:
        name: Smoke Test (${{ matrix.os }}, Java 21)
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
        steps:
            - name: Check out code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Set up JDK 21
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
              with:
                  java-version: '21'
                  distribution: 'temurin'

            - name: Build with Gradle
              working-directory: ./
              run: |
                  chmod +x gradlew
                  make wasm
                  make build

            - name: Run WasmSQLInterfaceTest
              working-directory: ./
              run: |
                  ./gradlew :agent_api:test --tests "vulnerabilities.WasmSQLInterfaceTest" --info

    smoke-test-musl:
        name: Smoke Test (${{matrix.image}}, Java 21)
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                image: [
                    "eclipse-temurin:21-jdk-alpine",
                    "amazoncorretto:21-alpine",
                    "azul/zulu-openjdk-alpine:21",
                    "bellsoft/liberica-openjdk-alpine:21"
                ]
        steps:
            - name: Check out code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Build with Gradle (native)
              working-directory: ./
              run: |
                  chmod +x gradlew
                  make wasm
                  make build

            - name: Run WasmSQLInterfaceTest on ${{matrix.image}}
              run: |
                  docker run --rm -v "$(pwd):/app" -w /app ${{matrix.image}} sh -c "
                    chmod +x gradlew && \
                    AIKIDO_DEBUG=true ./gradlew :agent_api:test --tests 'vulnerabilities.WasmSQLInterfaceTest' --info
                  "

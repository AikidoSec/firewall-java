name: 🧪 QA Tests
permissions:
    contents: read
on:
    push: {}
    workflow_call: {}

jobs:
    qa-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout firewall-java
              uses: actions/checkout@v5
              with:
                  path: firewall-java

            - name: Checkout zen-demo-java
              uses: actions/checkout@v5
              with:
                  repository: Aikido-demo-apps/zen-demo-java
                  path: zen-demo-java
                  ref: main
                  submodules: true

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: 'temurin'

            - name: Build with Gradle
              working-directory: ./firewall-java
              run: |
                  chmod +x gradlew
                  make wasm
                  make build

                  # Move the build jars to demo app
                  mv dist ../zen-demo-java/zen_dist

            - name: Replace Dockerfile with QA version
              run: |
                  cp firewall-java/.github/workflows/Dockerfile.qa zen-demo-java/Dockerfile

            - name: Run Firewall QA Tests
              uses: AikidoSec/firewall-tester-action@3d448c6929e168148cf74c3d998d1dd5950d40ee # v1.1.1
              with:
                  dockerfile_path: ./zen-demo-java/Dockerfile
                  app_port: 8080
                  skip_tests: test-ssrf,test-demo-apps-generic-tests

name: 📦 Publish new Release

on:
  push:
    tags:
      - "v*"

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  build:
    needs: extract-version
    runs-on: open-source-releaser
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set the version for this release
        run: make replace_version version=${{ needs.extract-version.outputs.version }}
      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'adopt'
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          make wasm
          make build
      - name: Create zip and tar.gz files of the build
        run: |
          mv dist/ zen/
          zip -r zen.zip zen/*
          tar -czf zen.tar.gz zen/*
      - name: Generate SHA checksums
        run: |
          shasum -a 256 zen.zip > zen.zip.sha256sum
          shasum -a 256 zen.tar.gz > zen.tar.gz.sha256sum
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: |
            zen.zip
            zen.zip.sha256sum
            zen.tar.gz
            zen.tar.gz.sha256sum

  release:
    needs: [extract-version, build]
    runs-on: open-source-releaser
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          draft: true
          files: |
            zen.zip
            zen.zip.sha256sum
            zen.tar.gz
            zen.tar.gz.sha256sum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

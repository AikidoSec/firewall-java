buildscript {
    dependencies {
        classpath 'com.dylibso.chicory:build-time-compiler:1.7.5'
    }
}

plugins {
    id 'java'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.5.1'
}

jacoco {
    toolVersion "0.8.15"
    reportsDirectory = layout.buildDirectory.dir('jacoco')
}

def zenInternalsWasm = layout.projectDirectory.file('src/main/resources/zen_internals.wasm')
def zenInternalsGeneratedDirectory = layout.buildDirectory.dir('generated/chicory/zen-internals').get().asFile
def zenInternalsGeneratedSourceDirectory = new File(zenInternalsGeneratedDirectory, 'sources')
def zenInternalsGeneratedClassDirectory = new File(zenInternalsGeneratedDirectory, 'classes')
def zenInternalsGeneratedResourceDirectory = new File(zenInternalsGeneratedDirectory, 'resources')
def zenInternalsClassName = 'dev.aikido.agent_api.vulnerabilities.sql_injection.generated.ZenInternals'
def zenInternalsInterpretedFunctions = [865, 3165] as Set

def generateZenInternals = tasks.register('generateZenInternals') {
    inputs.file(zenInternalsWasm)
    inputs.property('chicoryVersion', '1.7.5')
    inputs.property('className', zenInternalsClassName)
    inputs.property('interpreterFallback', 'FAIL')
    inputs.property('interpretedFunctions', zenInternalsInterpretedFunctions)
    outputs.dir(zenInternalsGeneratedSourceDirectory)
    outputs.dir(zenInternalsGeneratedClassDirectory)
    outputs.dir(zenInternalsGeneratedResourceDirectory)

    doLast {
        project.delete(zenInternalsGeneratedDirectory)
        def config = com.dylibso.chicory.build.time.compiler.Config.builder()
                .withWasmFile(zenInternalsWasm.asFile.toPath())
                .withName(zenInternalsClassName)
                .withTargetSourceFolder(zenInternalsGeneratedSourceDirectory.toPath())
                .withTargetClassFolder(zenInternalsGeneratedClassDirectory.toPath())
                .withTargetWasmFolder(zenInternalsGeneratedResourceDirectory.toPath())
                .withInterpreterFallback(com.dylibso.chicory.compiler.InterpreterFallback.FAIL)
                .withInterpretedFunctions(zenInternalsInterpretedFunctions)
                .build()
        def generator = new com.dylibso.chicory.build.time.compiler.Generator(config)
        def interpretedFunctions = generator.generateResources()
        generator.generateMetaWasm(interpretedFunctions)
        generator.generateSources()
    }
}

sourceSets.main.java.srcDir(zenInternalsGeneratedSourceDirectory)
sourceSets.main.resources.srcDir(zenInternalsGeneratedResourceDirectory)
sourceSets.main.output.dir(zenInternalsGeneratedClassDirectory, builtBy: generateZenInternals)
sourceSets.main.compileClasspath += files(zenInternalsGeneratedClassDirectory)

tasks.named('compileJava') {
    dependsOn(generateZenInternals)
}

tasks.named('processResources') {
    dependsOn(generateZenInternals)
    exclude 'zen_internals.wasm', 'zen_internals.wasm.sha256sum'
}

dependencies {
    implementation 'com.github.seancfoley:ipaddress:5.5.1'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.dylibso.chicory:runtime:1.7.5'
    // Junixsocket imports :
    implementation 'com.kohlschutter.junixsocket:junixsocket-core:2.10.1'
    implementation 'com.kohlschutter.junixsocket:junixsocket-server:2.10.1'
    // Subnets :
    implementation 'com.github.seancfoley:ipaddress:5.3.3'

    // For middleware :
    compileOnly 'io.javalin:javalin:6.3.0'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testImplementation 'org.mockito:mockito-core:5.0.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.0.0'
    testImplementation 'org.junit-pioneer:junit-pioneer:2.2.0'
    // Sink tests :
    testImplementation 'org.postgresql:postgresql:42.2.23'
    testImplementation 'mysql:mysql-connector-java:8.0.33'
    testImplementation 'org.mariadb.jdbc:mariadb-java-client:3.0.5'
    testImplementation 'com.microsoft.sqlserver:mssql-jdbc:10.2.0.jre8'
    testImplementation 'com.squareup.okhttp3:okhttp:4.10.0'
    testImplementation 'org.apache.httpcomponents:httpclient:4.5.13'

    // Spring Web for RestTemplate
    testImplementation 'org.springframework:spring-web:5.3.20'
    testImplementation 'org.springframework:spring-webmvc:5.3.20'
    testImplementation 'org.springframework:spring-test:5.3.20'

    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
}

test {
    jvmArgs '--add-opens', 'java.base/java.util=ALL-UNNAMED'
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
    jvmArgs '-Dnet.bytebuddy.experimental=true' // Mockito support.

    if (project.hasProperty('coverageRun')) {
        systemProperty 'AIK_INTERNAL_coverage_run', '1'
    }

    useJUnitPlatform()
    finalizedBy jacocoTestReport

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
    jacoco {
        enabled = true
    }
    doFirst {
        // JaCoCo starts tracking a class when Java loads it.
        // Our agent loads agent_api classes, so JaCoCo must start first.
        jvmArgs jacoco.getAsJvmArg(), "-javaagent:${project.rootDir}/dist/agent.jar=mode=daemon-disabled"
        jacoco.enabled = false
    }
}

jacocoTestReport {
    reports {
        xml.required = true
        csv.required = false
        html.required = false
    }
    dependsOn test
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.80
            }
        }
    }
    dependsOn test
}

shadowJar {
    mergeServiceFiles()
    manifest {
    }
}
